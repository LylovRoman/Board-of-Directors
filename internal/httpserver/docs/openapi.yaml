openapi: 3.0.3
info:
  title: BoardOfDirectors API
  version: "1.0.0"
  description: |
    API для управления пользователями и играми с event-sourced логикой партии.

servers:
  - url: http://localhost:8000

paths:
  /auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
                name:
                  type: string
                avatar_url:
                  type: string
              required: [login, password, name]
      responses:
        "201":
          description: Registered user and JWT token

  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
              required: [login, password]
      responses:
        "200":
          description: Authenticated user and JWT token

  /auth/me:
    get:
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user

  /auth/password:
    put:
      summary: Change current user password
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Password changed

  /leaderboard:
    get:
      summary: Get leaderboard
      description: Returns ranked player profiles. Use `sort=winrate`, `sort=respect`, or `sort=accuracy` to choose the primary weekly rating metric.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month, all]
            default: week
        - in: query
          name: sort
          schema:
            type: string
            enum: [winrate, respect, accuracy]
            default: winrate
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"

  /users/me/profile:
    get:
      summary: Get current user profile and stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current profile
    put:
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                avatar_url:
                  type: string
                company_position:
                  type: string
                  description: Player's display position inside the fictional company. Cosmetic only.
              required: [name, avatar_url]
      responses:
        "200":
          description: Updated profile

  /users/{id}/profile:
    get:
      summary: Get user profile and stats
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: User profile, stats, respect count, and whether the viewer has respected this user

  /users/{id}/respect:
    post:
      summary: Give +respect to a user
      description: A viewer can respect another user once per UTC week. Repeating the request in the same week is idempotent; a new week adds another respect.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Updated user profile

  /users:
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                required: [user]

    get:
      summary: List users
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                required: [users]

  /users/{id}:
    get:
      summary: Get user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                required: [user]

    put:
      summary: Update user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"

    delete:
      summary: Delete user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /games:
    post:
      summary: Create game
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Created game
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    $ref: "#/components/schemas/Game"
                  state:
                    $ref: "#/components/schemas/PublicGameState"

    get:
      summary: List games
      description: Returns room summaries. Expired lobby rooms older than one hour and bot-only lobbies may be removed before the list is returned.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Games list
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: "#/components/schemas/Game"

  /games/{id}:
    get:
      summary: Get game by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    $ref: "#/components/schemas/Game"

    put:
      summary: Update game
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
              required: [title]
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    $ref: "#/components/schemas/Game"

    delete:
      summary: Delete game
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Deleted

  /games/{id}/state:
    get:
      summary: Get personalized game state
      description: Returns viewer-specific state and advances due automatic timer events, including bot turns and inactive-player replacement.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Personalized game state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    $ref: "#/components/schemas/PublicGameState"

  /games/ws:
    get:
      summary: Open live games list WebSocket
      description: |
        Authenticated WebSocket endpoint. Pass the JWT as `?token=...`.
        The server sends `{ "type": "games", "games": Game[] }` messages with the current lobby list after game list changes.
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: WebSocket protocol switch

  /games/{id}/ws:
    get:
      summary: Open live game state WebSocket
      description: |
        Authenticated WebSocket endpoint. Pass the JWT as `?token=...`.
        The server sends personalized `{ "type": "state", "state": PublicGameState }` messages after game actions.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "101":
          description: WebSocket protocol switch

  /games/{id}/actions:
    post:
      summary: Send player action
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameActionRequest"
      responses:
        "200":
          description: Accepted action and updated state
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    description: Public emitted events only. Private events such as mole selection, mole objectives, and submitted votes are omitted.
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  state:
                    $ref: "#/components/schemas/PublicGameState"
                  game_deleted:
                    type: boolean
                    description: True when the action removed a lobby with no remaining real players.

  /admin/simulations/bot-games:
    post:
      summary: Run fast all-bot game simulations
      description: Runs in-memory bot-only games for balance statistics. Requires `ADMIN_API_TOKEN` to be configured on the server and sent as `X-Admin-Token`. Set `bot_memorandum_count` above 1 to give simulation-only director bots extra hidden memorandum cards and stronger mathematical inference without changing normal games. Use `bot_memorandum_type` to force every simulation memorandum to `opportunity` or `risk`; omitted/`mixed` alternates types.
      security:
        - adminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotSimulationRequest"
      responses:
        "200":
          description: Aggregated bot simulation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotSimulationResponse"
        "401":
          description: Missing or invalid admin token

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token

  schemas:

    BotSimulationRequest:
      type: object
      properties:
        games:
          type: integer
          default: 1
          minimum: 1
          maximum: 1000
        players:
          type: integer
          default: 6
          minimum: 3
          maximum: 8
        seed:
          type: integer
          format: int64
          description: Optional deterministic RNG seed.
        include_games:
          type: boolean
          default: false
        bot_memorandum_count:
          type: integer
          default: 1
          minimum: 1
          maximum: 50
          description: Number of private memorandum cards each non-Mole simulation bot receives. Extra cards are hidden inside the simulator for smarter balance testing; normal games still assign one memorandum per director.
        bot_memorandum_type:
          type: string
          enum: [mixed, opportunity, risk]
          default: mixed
          description: Type policy for simulation bot memorandums. `opportunity` or `risk` forces all cards to that type. `mixed` preserves the default alternating opportunity/risk behavior.

    BotSimulationGameResult:
      type: object
      properties:
        index:
          type: integer
        winner:
          type: string
          enum: [mole, players]
        rounds:
          type: integer
        mole_user_id:
          type: integer
          format: int64
        mole_points:
          type: integer
        players_points:
          type: integer
        accepted_clean_count:
          type: integer
        accepted_target_count:
          type: integer
        accepted_sabotage_count:
          type: integer
        accepted_decisions:
          type: array
          items:
            type: string

    BotSimulationResponse:
      type: object
      properties:
        games:
          type: integer
        players:
          type: integer
        seed:
          type: integer
          format: int64
        bot_memorandum_count:
          type: integer
        bot_memorandum_type:
          type: string
          enum: [mixed, opportunity, risk]
        mole_wins:
          type: integer
        players_wins:
          type: integer
        mole_winrate:
          type: number
          format: double
        players_winrate:
          type: number
          format: double
        average_rounds:
          type: number
          format: double
        accepted_clean_count:
          type: integer
        accepted_target_count:
          type: integer
        accepted_sabotage_count:
          type: integer
        average_accepted_clean_count:
          type: number
          format: double
        average_accepted_target_count:
          type: number
          format: double
        average_accepted_sabotage_count:
          type: number
          format: double
        results:
          type: array
          items:
            $ref: "#/components/schemas/BotSimulationGameResult"

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        company_position:
          type: string
        respect_count:
          type: integer
        respected_by_me:
          type: boolean
        last_seen_at:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
          nullable: true
      required: [id, name, created_at]

    RoleStats:
      type: object
      properties:
        games:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        winrate:
          type: number
          format: double
        major_votes:
          type: integer
        aligned_votes:
          type: integer
        accuracy_bps:
          type: integer
          description: Accuracy in basis points, where 10000 means 100%.
      required: [games, wins, losses, winrate]

    UserStats:
      type: object
      properties:
        total:
          $ref: "#/components/schemas/RoleStats"
        mole:
          $ref: "#/components/schemas/RoleStats"
        director:
          $ref: "#/components/schemas/RoleStats"
      required: [total, mole, director]

    Profile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            stats:
              $ref: "#/components/schemas/UserStats"
            respect_count:
              type: integer
            respected_by_me:
              type: boolean
            xp:
              type: integer
            rank_title:
              type: string
          required: [stats, respect_count, respected_by_me, xp, rank_title]

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        user:
          $ref: "#/components/schemas/Profile"
        games:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        winrate:
          type: number
          format: double
        rating_points:
          type: integer
        respect_delta:
          type: integer
        accuracy_bps:
          type: integer
        xp:
          type: integer
        rank_title:
          type: string
      required: [rank, user, games, wins, losses, winrate, rating_points, respect_delta, accuracy_bps, xp, rank_title]

    LeaderboardResponse:
      type: object
      properties:
        period:
          type: string
          enum: [week, month, all]
        sort:
          type: string
          enum: [winrate, respect, accuracy]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      required: [period, sort, entries]

    Game:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        company_name:
          type: string
        company_situation:
          type: string
        created_at:
          type: string
        status:
          type: string
          enum: [lobby, started, finished]
        phase:
          type: string
          enum: [mole_objective_selection, major_voting, governance_proposal, governance_voting]
        winner:
          type: string
        current_round:
          type: integer
        player_count:
          type: integer
        started_player_count:
          type: integer
          description: Number of active players when the game started; clients can use it as the denominator for started/finished rooms.
        player_user_ids:
          type: array
          items:
            type: integer
            format: int64
        players:
          type: array
          items:
            $ref: "#/components/schemas/GameListPlayer"
        is_member:
          type: boolean
      required: [id, title, created_at]

    GameListPlayer:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        name:
          type: string
        avatar_url:
          type: string
        company_position:
          type: string
        is_host:
          type: boolean
        is_ceo:
          type: boolean
        is_bot:
          type: boolean
      required: [user_id, name, is_host, is_ceo, is_bot]

    CreateGameRequest:
      type: object
      description: Creates a room and generates a persistent company scenario for the game.
      properties:
        title:
          type: string
      required: [title]

    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
        game_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
          nullable: true
        actor_name:
          type: string
          nullable: true
        event_type:
          type: string
        event_value:
          type: string
          nullable: true
        created_at:
          type: string
      required: [id, game_id, event_type, created_at]

    GameActionRequest:
      type: object
      properties:
        type:
          type: string
          enum:
            - join_game
            - leave_game
            - kick_player
            - ban_player
            - add_bot
            - send_chat_message
            - react_chat_message
            - start_game
            - choose_memorandum
            - select_mole_objectives
            - vote
            - submit_governance_proposal
            - skip_governance_proposal
        payload:
          oneOf:
            - $ref: "#/components/schemas/SendChatMessagePayload"
            - $ref: "#/components/schemas/ChooseMemorandumPayload"
            - $ref: "#/components/schemas/SelectMoleObjectivesPayload"
            - $ref: "#/components/schemas/VotePayload"
            - $ref: "#/components/schemas/SubmitGovernanceProposalPayload"
            - $ref: "#/components/schemas/ReactChatMessagePayload"
            - $ref: "#/components/schemas/AddBotPayload"
            - type: object
              additionalProperties: true
      required: [type]

    SendChatMessagePayload:
      type: object
      description: Chat message payload. Messages starting with `/me ` are posted as official statements from the player's effective position.
      properties:
        message:
          type: string
          maxLength: 500
      required: [message]

    ChooseMemorandumPayload:
      type: object
      description: Private director choice during mole_objective_selection. The Mole cannot use it. If a director does not choose before objectives are selected, opportunity is used.
      properties:
        type:
          type: string
          enum: [opportunity, risk]
      required: [type]

    SelectMoleObjectivesPayload:
      type: object
      description: Private action payload submitted only by the Mole during mole_objective_selection.
      properties:
        targets:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [A, B, C, D, E, F, G, H]
        sabotage:
          type: string
          enum: [A, B, C, D, E, F, G, H]
      required: [targets, sabotage]

    VotePayload:
      type: object
      description: Used for major voting and governance voting. During major voting, abstain is not allowed and decision must be one of current major_vote_options.
      properties:
        decision:
          type: string
        proposal_id:
          type: integer
        abstain:
          type: boolean

    ReactChatMessagePayload:
      type: object
      description: Toggles one emoji reaction for the acting player on a visible chat message.
      properties:
        message_id:
          type: integer
          format: int64
        emoji:
          type: string
          enum: ["👍", "🤝", "💼", "📈", "⚠️", "🕵️", "✅", "🔥"]
      required: [message_id, emoji]

    AddBotPayload:
      type: object
      description: Host-only lobby action. Adds one or more synthetic bot players to the room without creating real user accounts.
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
        name:
          type: string
          description: Optional display name when adding a single bot.

    SubmitGovernanceProposalPayload:
      type: object
      description: Governance proposal submission. Backend ignores client share_bps and stores the actual applicable share_bps after clamping the proposer's effective authority to available treasury or the 5% player minimum.
      properties:
        proposal_type:
          type: string
          enum: [share_transfer, treasury_grant, treasury_buyback]
        from_user_id:
          type: integer
          format: int64
        to_user_id:
          type: integer
          format: int64
        target_user_id:
          type: integer
          format: int64
      required: [proposal_type]

    PublicPlayerState:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        name:
          type: string
        avatar_url:
          type: string
        company_position:
          type: string
        share_bps:
          type: integer
        authority_bps:
          type: integer
          description: Effective authority in bps, including the current CEO +1% bonus when applicable.
        is_host:
          type: boolean
        is_ceo:
          type: boolean
        is_bot:
          type: boolean
        role:
          type: string

    PublicVoteState:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        has_voted:
          type: boolean
        proposal_id:
          type: integer
          description: Present during governance_voting when this player voted for a proposal.
        abstain:
          type: boolean
          description: Present during governance_voting after this player voted.
        share_bps:
          type: integer
          description: Revealed during governance_voting.
        authority_bps:
          type: integer
          description: Revealed during governance_voting.
        voting_power_bps:
          type: integer
          description: share_bps + authority_bps, revealed during governance_voting.
      required: [user_id, has_voted]

    PublicOwnVoteState:
      type: object
      properties:
        decision:
          type: string
        proposal_id:
          type: integer
        abstain:
          type: boolean
      required: [abstain]

    PublicGovernanceProposal:
      type: object
      properties:
        id:
          type: integer
        round:
          type: integer
        proposer_user_id:
          type: integer
          format: int64
        author_user_ids:
          type: array
          description: All authors when semantically duplicate governance proposals are merged.
          items:
            type: integer
            format: int64
        proposal_type:
          type: string
          enum: [share_transfer, treasury_grant, treasury_buyback, appoint_ceo]
        from_user_id:
          type: integer
          format: int64
        to_user_id:
          type: integer
          format: int64
        target_user_id:
          type: integer
          format: int64
        share_bps:
          type: integer
      required: [id, round, proposer_user_id, proposal_type]

    PublicGovernanceSubmission:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [submitted, skipped, ""]
        proposal_id:
          type: integer
      required: [user_id]

    PublicGovernanceReport:
      type: object
      properties:
        round:
          type: integer
        outcome:
          type: string
          enum: [accepted, rejected]
        proposal:
          $ref: "#/components/schemas/PublicGovernanceProposal"
        reason:
          type: string
        votes:
          type: array
          description: Revealed governance vote math for the resolved governance round.
          items:
            $ref: "#/components/schemas/PublicGovernanceVoteReport"
      required: [round, outcome]

    PublicGovernanceVoteReport:
      type: object
      properties:
        proposal_id:
          type: integer
        proposal:
          $ref: "#/components/schemas/PublicGovernanceProposal"
        proposal_title:
          type: string
          description: Human-readable snapshot of the proposal this vote bucket supported. Present for non-abstain buckets so historical reports do not need to render proposal numbers.
        abstain:
          type: boolean
        share_bps:
          type: integer
        authority_bps:
          type: integer
        voting_power_bps:
          type: integer
        voter_count:
          type: integer
        voters:
          type: array
          items:
            $ref: "#/components/schemas/PublicGovernanceVoterReport"
      required: [abstain, share_bps, authority_bps, voting_power_bps, voter_count, voters]

    PublicGovernanceVoterReport:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        name:
          type: string
        share_bps:
          type: integer
        authority_bps:
          type: integer
        voting_power_bps:
          type: integer
      required: [user_id, name, share_bps, authority_bps, voting_power_bps]

    PublicDecisionVoteReport:
      type: object
      properties:
        decision:
          type: string
        abstain:
          type: boolean
        share_bps:
          type: integer
        voter_count:
          type: integer
        voters:
          type: array
          description: Revealed voters for this decision group after the round is resolved.
          items:
            $ref: "#/components/schemas/PublicDecisionVoterReport"
      required: [decision, abstain, share_bps, voter_count, voters]

    PublicDecisionVoterReport:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        name:
          type: string
        share_bps:
          type: integer
      required: [user_id, name, share_bps]

    PublicRoundReport:
      type: object
      properties:
        round:
          type: integer
        outcome:
          type: string
          enum: [accepted, rejected]
        decision:
          type: string
        reason:
          type: string
        votes:
          type: array
          items:
            $ref: "#/components/schemas/PublicDecisionVoteReport"
      required: [round, outcome, votes]

    PublicFinalSummary:
      type: object
      properties:
        winner:
          type: string
        winner_user_ids:
          type: array
          items:
            type: integer
            format: int64
        mole_user_id:
          type: integer
          format: int64
        mole_targets:
          type: array
          items:
            type: string
        mole_sabotage:
          type: string
        mole_points:
          type: integer
        players_points:
          type: integer
        least_mistake_user_ids:
          type: array
          items:
            type: integer
            format: int64
        player_stats:
          type: array
          items:
            $ref: "#/components/schemas/PublicFinalPlayerStats"

    PublicFinalPlayerStats:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
        won:
          type: boolean
        major_votes:
          type: integer
        aligned_votes:
          type: integer
        mistakes:
          type: integer
        accuracy_bps:
          type: integer
        xp_earned:
          type: integer
        xp_breakdown:
          type: array
          items:
            $ref: "#/components/schemas/XPAward"

    XPAward:
      type: object
      properties:
        reason:
          type: string
        points:
          type: integer
      required: [reason, points]

    PublicReplayStep:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        title:
          type: string
        summary:
          type: string
        round:
          type: integer
        outcome:
          type: string
        decision:
          type: string
        proposal:
          $ref: "#/components/schemas/PublicGovernanceProposal"
        winner:
          type: string
        votes:
          type: array
          items:
            $ref: "#/components/schemas/PublicReplayVote"

    PublicReplayVote:
      type: object
      properties:
        label:
          type: string
        share_bps:
          type: integer
        voting_power_bps:
          type: integer
        voters:
          type: array
          items:
            type: string

    PublicChatMessage:
      type: object
      description: >
        Chat message returned in public game state. Structured system messages use concise titles
        without duplicating the generated company name; company context remains in summary/details.
        Major vote result titles use the accepted decision letter, for example `Итоги major vote: C`,
        or `Итоги major vote: не принято` when no decision is accepted. Vote details and reward
        details list player names without embedding company_position.
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        user_name:
          type: string
        avatar_url:
          type: string
        company_position:
          type: string
          description: Sender's display position for user and official chat messages. System vote/reward details do not embed positions in player lists.
        message:
          type: string
        kind:
          type: string
          enum: [user, system]
        system_event_type:
          type: string
          description: Present for structured system messages, for example company_briefing, major_vote_accepted, governance_accepted, sabotage_accepted, mole_revealed.
        title:
          type: string
          description: Concise display title for structured system messages. Company names are not duplicated in this field.
        summary:
          type: string
        details:
          type: array
          items:
            type: string
        tone:
          type: string
          enum: [success, warning, danger]
        collapsible:
          type: boolean
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/PublicChatReaction"
        created_at:
          type: string
      required: [id, user_id, user_name, message, created_at]

    PublicChatReaction:
      type: object
      properties:
        emoji:
          type: string
        count:
          type: integer
        reacted_by_me:
          type: boolean
      required: [emoji, count, reacted_by_me]

    PublicMemorandum:
      type: object
      description: Private director hint. Present only for non-Mole directors after the Mole has selected objectives.
      properties:
        type:
          type: string
          enum: [opportunity, risk]
        decisions:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
            enum: [A, B, C, D, E, F, G, H]
      required: [type, decisions]

    PublicGameState:
      type: object
      properties:
        game_id:
          type: integer
          format: int64
        title:
          type: string
        company_name:
          type: string
          description: Generated fictional company name for this game.
        company_situation:
          type: string
          description: Generated current company situation for this game.
        status:
          type: string
        phase:
          type: string
          enum: [mole_objective_selection, major_voting, governance_proposal, governance_voting]
        is_finished:
          type: boolean
        winner:
          type: string
        started_player_count:
          type: integer
          description: Number of active players when the game started.
        current_round:
          type: integer
        governance_round:
          type: integer
        treasury_share_bps:
          type: integer
        available_decisions:
          type: array
          items:
            type: string
        major_vote_options:
          type: array
          description: Current 4-card major vote showcase. Falls back to available_decisions for legacy rounds.
          items:
            type: string
        major_vote_unlocked_at:
          type: string
          format: date-time
          nullable: true
          description: Present for the first major vote when voting is locked for memorandum review.
        phase_started_at:
          type: string
          format: date-time
          nullable: true
          description: Server timestamp when the current phase started.
        phase_deadline_at:
          type: string
          format: date-time
          nullable: true
          description: Current phase deadline. Inactive human players are replaced by bots after this time.
        decision_types:
          type: object
          additionalProperties:
            type: string
            enum: [growth, empowerment]
        accepted_decisions:
          type: array
          items:
            type: string
        rejected_decisions:
          type: array
          items:
            type: string
        players:
          type: array
          items:
            $ref: "#/components/schemas/PublicPlayerState"
        me:
          $ref: "#/components/schemas/PublicPlayerState"
        current_votes:
          type: array
          items:
            $ref: "#/components/schemas/PublicVoteState"
        my_current_vote:
          $ref: "#/components/schemas/PublicOwnVoteState"
        governance_proposals:
          type: array
          items:
            $ref: "#/components/schemas/PublicGovernanceProposal"
        governance_submissions:
          type: array
          items:
            $ref: "#/components/schemas/PublicGovernanceSubmission"
        governance_reports:
          type: array
          items:
            $ref: "#/components/schemas/PublicGovernanceReport"
        round_reports:
          type: array
          items:
            $ref: "#/components/schemas/PublicRoundReport"
        chat_messages:
          type: array
          items:
            $ref: "#/components/schemas/PublicChatMessage"
        mole_targets:
          type: array
          description: Private. Present only for the Mole; these are the 1-point Podkop objectives.
          items:
            type: string
        mole_sabotage:
          type: string
          description: Private. Present only for the Mole; this is the 2-point Sabotage objective.
        memorandum_preference:
          type: string
          enum: [opportunity, risk]
          description: Private. Present only for the viewing director during setup if they chose a memorandum type.
        memorandum:
          $ref: "#/components/schemas/PublicMemorandum"
        mole_victory_points:
          type: integer
          description: Present for the Mole from setup; revealed to all players after the sabotage decision is accepted.
        players_victory_points:
          type: integer
          description: Present for the Mole from setup; revealed to all players after the sabotage decision is accepted.
        final_summary:
          $ref: "#/components/schemas/PublicFinalSummary"
        replay_steps:
          type: array
          items:
            $ref: "#/components/schemas/PublicReplayStep"
        available_actions:
          type: array
          items:
            type: string
